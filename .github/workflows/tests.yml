name: tests
on: [push, pull_request]
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1
      - run: pip install -r requirements.txt
      # these tests need no OpenFOAM install: they check case files, parsers and the surrogate code
      - run: python -m unittest discover -s tests
